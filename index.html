

<!DOCTYPE html>
<html>
<head>
  <title>Beautifier + Jinja Generator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; }
    textarea { width: 100%; height: 150px; margin-bottom: 20px; }
    input { width: 100%; margin-bottom: 10px; padding: 6px; }
    button { padding: 10px 15px; cursor: pointer; margin-bottom: 20px; }
    .pair { display: flex; gap: 10px; margin-bottom: 10px; }
    .pair input { flex: 1; }
  </style>
</head>
<body>

<h2>Beautifier + Jinja Generator</h2>

<!-- Beautifier Section -->
<h3>Beautifier</h3>
<textarea id="input"></textarea>
<button id="beautifyBtn">Beautify</button>
<textarea id="output"></textarea>

<hr>

<!-- Jinja Generator -->
<h3>Jinja Generator</h3>

<p><b>Attribute name (ex: deployment_state_code)</b></p>
<input type="text" id="attributeName" placeholder="deployment_state_code">

<p><b>Enter Attribute Values + Dynamic Variable:</b></p>

<div id="pairsContainer">
  <div class="pair">
    <input type="text" placeholder="attribute value">
    <input type="text" placeholder="Dynamic Variable">
    <button class="removeBtn">Remove</button>
  </div>
</div>

<button id="addPairBtn">Add More</button>

<p><b>Default Dynamic Variable (optional):</b></p>
<input type="text" id="defaultSubject" placeholder="If empty, last Dynamic Variable becomes default">

<button id="generateBtn">Generate Jinja</button>

<textarea id="jinjaOutput" style="height: 220px;"></textarea>

<script>
/* ================================
   BEAUTIFIER — WORKING
================================ */
document.getElementById("beautifyBtn").addEventListener("click", function () {
  let code = document.getElementById("input").value.trim();

  if (!code) return;

  // Split Jinja tags onto new lines
  code = code
    .replace(/{%/g, "\n{%")
    .replace(/%}/g, "%}\n")
    .replace(/\n+/g, "\n");

  let lines = code.split("\n");
  let pretty = "";

  lines.forEach(line => {
    let trimmed = line.trim();
    if (trimmed.startsWith("{%")) {
      pretty += trimmed + "\n";
    } else {
      pretty += "  " + trimmed + "\n";
    }
  });

  document.getElementById("output").value = pretty.trim();
});

/* ================================
   ADD MORE — WORKING
================================ */
document.getElementById("addPairBtn").addEventListener("click", function () {
  const container = document.getElementById("pairsContainer");

  const div = document.createElement("div");
  div.className = "pair";
  div.innerHTML = `
      <input type="text" placeholder="attribute value">
      <input type="text" placeholder="Subject line">
      <button class="removeBtn">Remove</button>
  `;

  container.appendChild(div);
});

/* ================================
   REMOVE PAIR — WORKING
================================ */
document.addEventListener("click", function (e) {
  if (e.target.classList.contains("removeBtn")) {
    e.target.parentElement.remove();
  }
});

/* ================================
   GENERATE JINJA — WORKING
================================ */
document.getElementById("generateBtn").addEventListener("click", function () {
  const attribute = document.getElementById("attributeName").value.trim();
  let defaultSL = document.getElementById("defaultSubject").value.trim();

  if (!attribute) {
    alert("Enter attribute name.");
    return;
  }

  // Collect all pairs
  let pairs = [...document.querySelectorAll("#pairsContainer .pair")].map(p => {
    return {
      value: p.children[0].value.trim(),
      subject: p.children[1].value.trim()
    };
  }).filter(p => p.value && p.subject);

  if (pairs.length === 0) {
    alert("Add at least one value + subject pair.");
    return;
  }

  // If no default provided → last subject becomes default
  if (!defaultSL) {
    const last = pairs.pop();
    defaultSL = last.subject;
  }

  let jinja = "";

  pairs.forEach((p, i) => {
    if (i === 0) {
      jinja += `{%- if customer.${attribute} == "${p.value}" -%}\n  ${p.subject}\n`;
    } else {
      jinja += `{%- elif customer.${attribute} == "${p.value}" -%}\n  ${p.subject}\n`;
    }
  });

  jinja += `{%- else -%}\n  ${defaultSL}\n{%- endif -%}`;

  document.getElementById("jinjaOutput").value = jinja;
});
</script>

</body>
</html>
